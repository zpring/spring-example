name: "Release Train - Rebase Snapshot Branches"
"on":
  workflow_dispatch:
    inputs:
      oss-repository:
        description: "OSS repository to rebase onto"
        required: true
        type: string
      oss-branch:
        description: "OSS branch to rebase onto"
        required: true
        type: string
jobs:
  handle:
    name: "Handle Rebase"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_BRANCHES_SYNCHRONIZATION_TOKEN }}
    - name: "Rebase"
      shell: bash
      run: |
        git config user.name "Spring Builds"
        git config user.email "spring-builds@users.noreply.github.com"
        git remote add oss https://github.com/${{ inputs.oss-repository }}
        git fetch upstream ${{ inputs.oss-branch }}
        chmod +x .github/scripts/release-train-rebase-snapshot-branches.sh
        .github/scripts/release-train-rebase-snapshot-branches.sh
